<text x="1047.5" y="126" font-size="15" fill="#17181c" text-anchor="middle" font-weight="bold">Infeasible specs</text>
<text x="1047.5" y="144" font-size="12.5" fill="#50535c" text-anchor="middle" font-weight="normal">right answer: declare it infeasible</text>
