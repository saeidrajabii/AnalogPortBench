<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 462" font-family="Helvetica, Arial, sans-serif">
<title>AnalogPortBench at a glance</title>
<rect width="1200" height="462" rx="14" fill="#ffffff"/>
