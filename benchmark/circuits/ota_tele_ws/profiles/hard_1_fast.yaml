# Hard spec point for ota_tele_ws at VDD = 1.2 V. Limits are as tight as the golden design allows: every limit
# is met with >= 5 % margin at TT (both (v-L)/L and (v-L)/v) and the golden passes all five corners.
profile: hard_1_fast
description: 'Hard point 1: fastest settling and widest bandwidth (UGB > 100 MHz into 1 pF, 1 % settling < 8 ns); modest gain and swing.'
circuit: ota_tele_ws
dut_ports: iref inp inn out
testbenches:
  ota_ol_ac:
    IREF_uA: 20
    VCM: VDD/2
    CL: 1p
  opamp_tran:
    IREF_uA: 20
    VCM: VDD/2
    CL: 1p
    VSTEP: 0.2
  ota_swing_dc:
    IREF_uA: 20
    VCM: VDD/2
vdd: 1.2
conditions: TT, 27 C, VDD = 1.2 V, VCM = VDD/2 = 0.6 V, Iref = 20 uA, CL = 1 pF
golden: benchmark/golden/ota_tele_ws_hard_1_fast.sp
limits:
  dc_gain_dB:
    op: '>='
    limit: 45.7
    rule: hard point; golden TT 49.63 (+8.6 %), worst corner 45.75 (sf)
  ugb_Hz:
    op: '>='
    limit: 101000000.0
    rule: hard point; golden TT 109100000 (+8.0 %), worst corner 101500000 (sf)
  pm_deg:
    op: '>='
    limit: 60.0
    rule: fixed for every hard point; golden TT 70.4, worst corner 67.2 (fs)
  power_uW:
    op: '<='
    limit: 295.0
    rule: hard point; golden TT 279.9 (-5.1 %), worst corner 282.6 (fs)
  rise_settle_ns:
    op: '<='
    limit: 7.75
    rule: hard point; golden TT 5.51 (-29 %), worst corner 7.73 (sf)
  fall_settle_ns:
    op: '<='
    limit: 8.05
    rule: hard point; golden TT 5.93 (-26 %), worst corner 8.03 (fs)
  swing_V:
    op: '>='
    limit: 0.398
    rule: hard point; golden TT 0.422 (+6.0 %), worst corner 0.400 (fs)
  n_triode:
    op: '<='
    limit: 0
    rule: fixed for every hard point
