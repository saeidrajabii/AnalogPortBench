# Spec profile for the spec-variation study (see profiles/README.md).
profile: p1_swing_lowpower
description: Large output swing at low power; moderate gain and speed are enough.
circuit: ota_tele
dut_ports: iref inp inn out
testbenches:
  opamp_loop:
    IREF_uA: 20
    VCM: VDD/2
    CL: 1p
  opamp_tran:
    IREF_uA: 20
    VCM: VDD/2
    CL: 1p
    VSTEP: 0.2
  ota_swing_dc:
    IREF_uA: 20
    VCM: VDD/2
vdd: 1.2
conditions: TT, 27 C, VDD = 1.2 V, VCM = VDD/2 = 0.6 V, Iref = 20 uA, CL = 1 pF
limits:
  dc_gain_dB:
    op: '>='
    limit: 60.0
    rule: fixed
  ugf_Hz:
    op: '>='
    limit: 20000000.0
    rule: fixed
  pm_deg:
    op: '>='
    limit: 60.0
    rule: fixed
  gm_dB:
    op: '>='
    limit: 10.0
    rule: fixed
  power_uW:
    op: <=
    limit: 160.0
    rule: fixed
  swing_V:
    op: '>='
    limit: 0.75
    rule: fixed
  rise_settle_ns:
    op: <=
    limit: 60.0
    rule: fixed
  fall_settle_ns:
    op: <=
    limit: 60.0
    rule: fixed
  n_triode:
    op: <=
    limit: 0
    rule: fixed
