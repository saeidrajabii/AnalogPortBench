# HARD spec point for opamp_2stg at VDD = 1.2 V.
# Limits set as hard as the hand-designed golden benchmark/golden/opamp_2stg_hard_3_lowpower.sp allows
# with >= 5 % margin on every limit at TT and a pass at all five corners (tt ff ss sf fs).
profile: hard_3_lowpower
description: 'Low power: the spec.yaml performance at <= 169.2 uW (spec.yaml allows 296.4 uW).'
circuit: opamp_2stg
dut_ports: iref inp inn out
testbenches:
  opamp_loop:
    IREF_uA: 20
    VCM: 0.9
    CL: 1p
  opamp_tran:
    IREF_uA: 20
    VCM: 0.9
    CL: 1p
    VSTEP: 0.2
vdd: 1.2
conditions: TT, 27 C, VDD = 1.2 V, VCM = 0.9 V (as the source testbench), Iref = 20 uA, CL = 1 pF
limits:
  dc_gain_dB:
    op: '>='
    limit: 72.71
    rule: 'spec.yaml (source - 3 dB)'
  ugf_Hz:
    op: '>='
    limit: 66590000.0
    rule: 'spec.yaml (0.8 x source)'
  pm_deg:
    op: '>='
    limit: 60.0
    rule: 'hard: >= 60 deg'
  gm_dB:
    op: '>='
    limit: 10.0
    rule: 'spec.yaml'
  power_uW:
    op: '<='
    limit: 169.2
    rule: 'hard: golden 160.7 uW at TT / 0.95; ff corner 163.1 uW'
  rise_settle_ns:
    op: '<='
    limit: 12.24
    rule: 'spec.yaml (1.5 x source)'
  fall_settle_ns:
    op: '<='
    limit: 26.73
    rule: 'spec.yaml (1.5 x source)'
  n_triode:
    op: '<='
    limit: 0
    rule: 'hard: no transistor out of saturation'
