# HARD spec point for opamp_2stg_ws at VDD = 1.2 V.
# Limits set as hard as the hand-designed golden benchmark/golden/opamp_2stg_ws_hard_3_lowpower.sp allows
# with >= 5 % margin on every limit at TT and a pass at all five corners (tt ff ss sf fs).
profile: hard_3_lowpower
description: 'Low power: the spec.yaml performance at <= 210 uW (spec.yaml allows 430.5 uW).'
circuit: opamp_2stg_ws
dut_ports: iref inp inn out
testbenches:
  opamp_loop:
    IREF_uA: 20
    VCM: 0.9
    CL: 1p
  opamp_tran:
    IREF_uA: 20
    VCM: 0.9
    CL: 1p
    VSTEP: 0.2
vdd: 1.2
conditions: TT, 27 C, VDD = 1.2 V, VCM = 0.9 V (as the source testbench), Iref = 20 uA, CL = 1 pF
limits:
  dc_gain_dB:
    op: '>='
    limit: 71.92
    rule: 'spec.yaml (source - 3 dB)'
  ugf_Hz:
    op: '>='
    limit: 70960000.0
    rule: 'spec.yaml (0.8 x source)'
  pm_deg:
    op: '>='
    limit: 60.0
    rule: 'hard: >= 60 deg'
  gm_dB:
    op: '>='
    limit: 10.0
    rule: 'spec.yaml'
  power_uW:
    op: '<='
    limit: 210.0
    rule: 'hard: golden 199.4 uW at TT x 1.05 = 209.3 uW; fs corner 206.9 uW'
  rise_settle_ns:
    op: '<='
    limit: 10.77
    rule: 'spec.yaml (1.5 x source)'
  fall_settle_ns:
    op: '<='
    limit: 24.62
    rule: 'spec.yaml (1.5 x source)'
  n_triode:
    op: '<='
    limit: 0
    rule: 'hard: no transistor out of saturation'
