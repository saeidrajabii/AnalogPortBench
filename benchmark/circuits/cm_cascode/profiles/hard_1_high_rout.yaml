profile: hard_1_high_rout
description: 'Hard point H1: extremely high output resistance (>= 1 GOhm, 13x the 1.2 V golden) with near-exact copy (|err| <= 0.02 %) and Vmin <= 0.16 V. A passive cascode stops at ~1e8 Ohm; needs a gain-boosted (regulated) cascode that works at 1.2 V.'
circuit: cm_cascode
dut_ports: in out
testbenches:
  mirror_dc:
    IREF_uA: 20
vdd: 1.2
conditions: TT, 27 C, VDD = 1.2 V, Iref = 20 uA into 'in', Vo swept 0..VDD (metrics at Vo = 0.9 V)
golden: benchmark/golden/cm_cascode_hard_1_high_rout.sp
limits:
  iout_err_pct:
    op: 'abs<='
    limit: 0.02
    rule: "hard point; golden TT 0.00 at all corners (reported to 0.01 %)"
  rout_kohm:
    op: '>='
    limit: 1000000.0
    rule: "hard point; golden TT 2.22e6 (+122 %), worst corner (fs) 1.25e6. Note: at > 1 GOhm the testbench resolves Rout only to ~10 % (8-digit current output, 0.01 V step)"
  vmin_V:
    op: '<='
    limit: 0.16
    rule: "hard point; golden TT 0.142 (+12.7 %), worst corner 0.145"
  n_triode:
    op: '<='
    limit: 0
    rule: "no transistor out of saturation at Vo = 0.9 V"
